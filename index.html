<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte Diario de Gatos</title>
  <style>
    :root {
      --bg: #1b1b1f;
      --card: #24242a;
      --accent: #ffcc80;
      --text: #f5f5f5;
      --muted: #777;
      --green: #25d366;
      --green-hover: #1ebe5d;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      margin: 2rem auto;
      max-width: 500px;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    fieldset {
      background-color: var(--card);
      border: 1px solid #333;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    legend {
      font-weight: bold;
      color: var(--accent);
    }

    .cat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.3rem 0;
      border-bottom: 1px solid #333;
    }

    .cat-row:last-child {
      border-bottom: none;
    }

    .cat-name {
      flex: 1;
    }

    .options {
      flex-shrink: 0;
      display: flex;
      gap: 1rem;
    }

    label {
      cursor: pointer;
      font-size: 0.95rem;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      background: #2f2f35;
      border: 1px solid #444;
      border-radius: 6px;
      color: var(--text);
      margin-top: 0.3rem;
      margin-bottom: 1rem;
    }

    textarea:focus, input:focus {
      outline: 2px solid var(--accent);
      background: #383840;
    }

    a#whatsappLink {
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      border-radius: 6px;
      padding: 0.8rem;
      margin-top: 1rem;
      display: block;
      font-size: 1.1rem;
      transition: 0.2s ease;
    }

    a.enabled {
      background: var(--green);
      color: white;
      pointer-events: auto;
    }

    a.enabled:hover {
      background: var(--green-hover);
    }

    a.disabled {
      background: #444;
      color: var(--muted);
      pointer-events: none;
    }

    .cat-icon {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="cat-icon">🐾</div>
  <h1>Reporte Diario de Gatos</h1>

  <form id="reportForm">
    <label for="reporter">Nombre del responsable:</label>
    <input type="text" id="reporter" name="reporter" placeholder="Ej: Rodrigo" required />

    <fieldset>
      <legend>Gatos</legend>
      <div id="catsList"></div>
    </fieldset>

    <label for="comments">Comentarios:</label>
    <textarea id="comments" name="comments" placeholder="Notas del día..." required></textarea>
  </form>

  <a id="whatsappLink" href="#" target="_blank" class="disabled">📱 Compartir por WhatsApp</a>

  <script>
    const gatos = ["Pelu", "Lilith", "Ruperta", "Isabella", "Kawaii", "Noche", "Whiskas", "Denzel"];
    const catsList = document.getElementById("catsList");
    const linkEl = document.getElementById("whatsappLink");
    const form = document.getElementById("reportForm");

    // Crear lista de gatos
    gatos.forEach(gato => {
      const div = document.createElement("div");
      div.className = "cat-row";
      div.innerHTML = `
        <span class="cat-name">${gato}</span>
        <div class="options">
          <label><input type="radio" name="${gato}" value="visto" required> Visto</label>
          <label><input type="radio" name="${gato}" value="no visto"> No visto</label>
        </div>
      `;
      catsList.appendChild(div);
    });

    function generarTexto() {
      const vistos = [];
      const noVistos = [];

      gatos.forEach(gato => {
        const estado = document.querySelector(`input[name="${gato}"]:checked`);
        if (estado) {
          if (estado.value === "visto") vistos.push(gato);
          else noVistos.push(gato);
        }
      });

      const responsable = document.getElementById("reporter").value.trim();
      const comentarios = document.getElementById("comments").value.trim();
      const fecha = new Date().toLocaleDateString("es-AR");

      const texto =
`👤 Responsable: ${responsable}
📅 Fecha: ${fecha}
😸 Gatos vistos: ${vistos.join(", ")}
😿 Gatos no vistos: ${noVistos.join(", ")}
📝 Comentarios: ${comentarios}`;

      return { texto, completos: validarFormulario(responsable, comentarios, vistos, noVistos) };
    }

    function validarFormulario(nombre, comentarios, vistos, noVistos) {
      const totalMarcados = vistos.length + noVistos.length;
      return nombre && comentarios && totalMarcados === gatos.length;
    }

    function actualizarLink() {
      const { texto, completos } = generarTexto();

      if (completos) {
        linkEl.className = "enabled";
        linkEl.href = "https://wa.me/?text=" + encodeURIComponent(texto);
      } else {
        linkEl.className = "disabled";
        linkEl.href = "#";
      }
    }

    form.addEventListener("change", actualizarLink);
    form.addEventListener("input", actualizarLink);
    actualizarLink();
  </script>
</body>
</html>
