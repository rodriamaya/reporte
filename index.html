<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte Diario de Gatos</title>
  <style>
    :root {
      --bg: #1b1b1f;
      --card: #24242a;
      --accent: #ffcc80;
      --text: #f5f5f5;
      --muted: #777;
      --green: #25d366;
      --green-hover: #1ebe5d;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      margin: 2rem auto;
      max-width: 500px;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    fieldset {
      background-color: var(--card);
      border: 1px solid #333;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    legend {
      font-weight: bold;
      color: var(--accent);
    }

    .cat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.3rem 0;
      border-bottom: 1px solid #333;
    }

    .cat-row:last-child {
      border-bottom: none;
    }

    .cat-name {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .info-icon {
      cursor: help;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--bg);
      font-size: 12px;
      font-weight: bold;
      position: relative;
    }

    .info-icon:hover::after {
      content: attr(data-description);
      position: absolute;
      left: 25px;
      top: 50%;
      transform: translateY(-50%);
      background: #2f2f35;
      color: var(--text);
      padding: 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      white-space: nowrap;
      z-index: 10;
      font-size: 0.85rem;
      font-weight: normal;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      min-width: 200px;
      white-space: normal;
      max-width: 250px;
    }

    .options {
      flex-shrink: 0;
      display: flex;
      gap: 1rem;
    }

    label {
      cursor: pointer;
      font-size: 0.95rem;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      background: #2f2f35;
      border: 1px solid #444;
      border-radius: 6px;
      color: var(--text);
      margin-top: 0.3rem;
      margin-bottom: 1rem;
    }

    textarea:focus, input:focus {
      outline: 2px solid var(--accent);
      background: #383840;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-row label {
      font-weight: bold;
    }

    #newCatField {
      display: none;
    }

    #newCatField.visible {
      display: block;
    }

    a#whatsappLink,
    #genericShareBtn {
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 0.8rem;
      margin-top: 1rem;
      display: block;
      width: 100%;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
      transition: 0.2s ease;
      box-sizing: border-box;
    }

    .enabled {
      background: var(--green);
      color: white;
      pointer-events: auto;
    }

    .enabled:hover {
      background: var(--green-hover);
    }

    .disabled {
      background: #444;
      color: var(--muted);
      pointer-events: none;
    }

    #genericShareBtn.enabled {
      background: var(--accent);
      color: var(--bg);
    }

    #genericShareBtn.enabled:hover {
      background: #ffb84d;
    }

    .cat-logo {
      display: block;
      margin: 0 auto 1rem;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <img src="img/logo-hfg.png" alt="Logo" class="cat-logo" />
  <h1>Reporte Diario de Gatos</h1>

  <form id="reportForm">
    <label for="reporter">Nombre del responsable:</label>
    <input type="text" id="reporter" name="reporter" placeholder="Ej: Rodrigo" required />

    <fieldset>
      <legend>Gatos</legend>
      <div id="catsList"></div>
    </fieldset>

    <div class="checkbox-row">
      <input type="checkbox" id="newCat" name="newCat" />
      <label for="newCat">🆕 Gato nuevo</label>
    </div>
    <div id="newCatField">
      <textarea id="newCatDescription" name="newCatDescription" placeholder="Describí el gato físicamente y dónde lo viste" rows="2"></textarea>
    </div>

    <label for="comments">Comentarios:</label>
    <textarea id="comments" name="comments" placeholder="Notas del día..." rows="10" required></textarea>
  </form>

  <a id="whatsappLink" href="#" target="_blank" class="disabled">📱 Compartir por WhatsApp</a>
  <button id="genericShareBtn" type="button" class="disabled" disabled>📤 Compartir (otras apps)</button>

  <script>
    const gatos = [
      { nombre: "Ruperta", descripcion: "Gata naranja y blanca, zona invernáculo (celia)" },
      { nombre: "Pelu", descripcion: "Gata negra, ojos amarillos claro, pelo largo, zona celia" },
      { nombre: "Kawaii", descripcion: "Gata negra, detalle en oreja izquierda, zona celia" },
      { nombre: "Denzel", descripcion: "Gato negro esbelto, zona celia" },
      { nombre: "Isabella", descripcion: "Gata negra, zona mariposario" },
      { nombre: "Yang", descripcion: "Gata blanca y negra, zona pañol" },
      { nombre: "Noche", descripcion: "Gata negra, zona baños" },
      { nombre: "Whiskas", descripcion: "Gato atigrado, zona escuela de jardinería" }
    ];

    const catsList = document.getElementById("catsList");
    const linkEl = document.getElementById("whatsappLink");
    const genericBtn = document.getElementById("genericShareBtn");
    const form = document.getElementById("reportForm");
    const supportsShare = !!navigator.share;
    const newCatCheckbox = document.getElementById("newCat");
    const newCatField = document.getElementById("newCatField");
    const newCatDescription = document.getElementById("newCatDescription");

    newCatCheckbox.addEventListener("change", () => {
      const checked = newCatCheckbox.checked;
      newCatField.classList.toggle("visible", checked);
      newCatDescription.required = checked;
      if (!checked) newCatDescription.value = "";
    });

    // Crear lista de gatos
    gatos.forEach(gato => {
      const div = document.createElement("div");
      div.className = "cat-row";
      div.innerHTML = `
        <span class="cat-name">
          ${gato.nombre}
          <span class="info-icon" data-description="${gato.descripcion}">i</span>
        </span>
        <div class="options">
          <label><input type="radio" name="${gato.nombre}" value="visto" required> Visto</label>
          <label><input type="radio" name="${gato.nombre}" value="no visto"> No visto</label>
        </div>
      `;
      catsList.appendChild(div);
    });

    function generarTexto() {
      const vistos = [];
      const noVistos = [];

      gatos.forEach(gato => {
        const estado = document.querySelector(`input[name="${gato.nombre}"]:checked`);
        if (estado) {
          if (estado.value === "visto") vistos.push(gato.nombre);
          else noVistos.push(gato.nombre);
        }
      });

      const responsable = document.getElementById("reporter").value.trim();
      const comentarios = document.getElementById("comments").value.trim();
      const hayGatoNuevo = newCatCheckbox.checked;
      const descripcionGatoNuevo = newCatDescription.value.trim();
      const fecha = new Date().toLocaleDateString("es-AR");

      let texto =
`👤 Responsable: ${responsable}
📅 Fecha: ${fecha}
😸 Gatos vistos: ${vistos.join(", ")}
😿 Gatos no vistos: ${noVistos.join(", ")}
📝 Comentarios: ${comentarios}`;

      if (hayGatoNuevo && descripcionGatoNuevo) {
        texto += `\n🚨🆕🐱 GATO NUEVO: ${descripcionGatoNuevo} 🚨`;
      }

      return { texto, completos: validarFormulario(responsable, comentarios, vistos, noVistos, hayGatoNuevo, descripcionGatoNuevo) };
    }

    function validarFormulario(nombre, comentarios, vistos, noVistos, hayGatoNuevo, descripcionGatoNuevo) {
      const totalMarcados = vistos.length + noVistos.length;
      const gatoNuevoOk = !hayGatoNuevo || !!descripcionGatoNuevo;
      return nombre && comentarios && totalMarcados === gatos.length && gatoNuevoOk;
    }

    function actualizarLink() {
      const { texto, completos } = generarTexto();

      if (completos) {
        linkEl.className = "enabled";
        linkEl.href = "https://wa.me/?text=" + encodeURIComponent(texto);

        if (supportsShare) {
          genericBtn.className = "enabled";
          genericBtn.disabled = false;
          genericBtn.dataset.texto = texto;
        }
      } else {
        linkEl.className = "disabled";
        linkEl.href = "#";
        genericBtn.className = "disabled";
        genericBtn.disabled = true;
      }
    }

    if (supportsShare) {
      genericBtn.addEventListener("click", async () => {
        try {
          await navigator.share({ text: genericBtn.dataset.texto });
        } catch (err) {
          // Usuario canceló el share o falló: no hacemos nada
        }
      });
    } else {
      genericBtn.style.display = "none";
    }

    form.addEventListener("change", actualizarLink);
    form.addEventListener("input", actualizarLink);
    actualizarLink();
  </script>
</body>
</html>
